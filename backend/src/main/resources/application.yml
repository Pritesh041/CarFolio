server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:application-local.yml
  application:
    name: carfolio
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carfolio}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

carfolio:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 30
  pricing:
    usd-to-inr-rate: 83.0
  groq:
    api-key: ${GROQ_API_KEY:}
    model: qwen/qwen3.6-27b
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:carfoliosupport@gmail.com}

logging:
  level:
    com.carfolio: ${LOG_LEVEL:DEBUG}
